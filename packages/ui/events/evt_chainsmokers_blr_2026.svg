    <polygon points="694.6,93.0 694.6,193.0 608.0,243.0 521.4,193.0 521.4,93.0 608.0,43.0" stroke-opacity="0.099" stroke-width="1.8"/>
    <polygon points="104.6,109.5 104.6,164.5 57.0,192.0 9.4,164.5 9.4,109.5 57.0,82.0" stroke-opacity="0.076" stroke-width="2.3"/>
    <polygon points="411.0,134.0 411.0,268.0 295.0,335.0 179.0,268.0 179.0,134.0 295.0,67.0" stroke-opacity="0.098" stroke-width="2.1"/>
    <polygon points="299.2,-59.0 299.2,81.0 178.0,151.0 56.8,81.0 56.8,-59.0 178.0,-129.0" stroke-opacity="0.111" stroke-width="2.6"/>
    <polygon points="715.3,253.5 715.3,378.5 607.0,441.0 498.7,378.5 498.7,253.5 607.0,191.0" stroke-opacity="0.089" stroke-width="2.4"/>
