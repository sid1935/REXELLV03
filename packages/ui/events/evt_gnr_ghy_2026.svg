<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Guns N&apos; Roses">
  <title>Guns N&apos; Roses — Khanapara Ground, Guwahati</title>
  <defs>
    <linearGradient id="g" x1="0" y1="450" x2="800" y2="0" gradientUnits="userSpaceOnUse"
                    gradientTransform="rotate(0 400 225)">
      <stop offset="0" stop-color="hsl(186 92% 58%)"/>
      <stop offset="1" stop-color="hsl(216 76% 50%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.29" cy="0.33" r="0.85">
      <stop offset="0" stop-color="hsl(186 100% 74%)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="hsl(186 100% 74%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#020526" stop-opacity="0"/>
      <stop offset="1" stop-color="#020526" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff">
