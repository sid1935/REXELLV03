    <polygon points="656.4,170.5 656.4,309.5 536.0,379.0 415.6,309.5 415.6,170.5 536.0,101.0" stroke-opacity="0.101" stroke-width="3.4"/>
    <polygon points="132.0,277.0 132.0,389.0 35.0,445.0 -62.0,389.0 -62.0,277.0 35.0,221.0" stroke-opacity="0.138" stroke-width="3.2"/>
    <polygon points="858.3,111.0 858.3,213.0 770.0,264.0 681.7,213.0 681.7,111.0 770.0,60.0" stroke-opacity="0.116" stroke-width="2.9"/>
    <polygon points="295.6,47.5 295.6,110.5 241.0,142.0 186.4,110.5 186.4,47.5 241.0,16.0" stroke-opacity="0.141" stroke-width="2.4"/>
    <polygon points="433.5,209.0 433.5,325.0 333.0,383.0 232.5,325.0 232.5,209.0 333.0,151.0" stroke-opacity="0.079" stroke-width="2.1"/>
    <polygon points="586.8,136.0 586.8,182.0 547.0,205.0 507.2,182.0 507.2,136.0 547.0,113.0" stroke-opacity="0.100" stroke-width="2.6"/>
