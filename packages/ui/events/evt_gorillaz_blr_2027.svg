    <polygon points="493.6,374.0 493.6,444.0 433.0,479.0 372.4,444.0 372.4,374.0 433.0,339.0" stroke-opacity="0.126" stroke-width="2.6"/>
    <polygon points="304.2,-38.0 304.2,102.0 183.0,172.0 61.8,102.0 61.8,-38.0 183.0,-108.0" stroke-opacity="0.084" stroke-width="1.8"/>
    <polygon points="53.1,42.5 53.1,101.5 2.0,131.0 -49.1,101.5 -49.1,42.5 2.0,13.0" stroke-opacity="0.137" stroke-width="3.3"/>
    <polygon points="523.7,186.5 523.7,263.5 457.0,302.0 390.3,263.5 390.3,186.5 457.0,148.0" stroke-opacity="0.083" stroke-width="2.2"/>
