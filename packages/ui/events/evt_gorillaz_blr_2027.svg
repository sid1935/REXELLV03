  <defs>
    <linearGradient id="g" x1="0" y1="450" x2="800" y2="0" gradientUnits="userSpaceOnUse"
                    gradientTransform="rotate(8 400 225)">
      <stop offset="0" stop-color="hsl(265 92% 58%)"/>
      <stop offset="1" stop-color="hsl(295 76% 50%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.44" cy="0.48" r="0.85">
