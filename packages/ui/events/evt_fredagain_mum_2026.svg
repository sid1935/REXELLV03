<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Fred again..">
  <title>Fred again.. — Mahalaxmi Race Course, Mumbai</title>
  <defs>
    <linearGradient id="g" x1="0" y1="450" x2="800" y2="0" gradientUnits="userSpaceOnUse"
                    gradientTransform="rotate(-9 400 225)">
      <stop offset="0" stop-color="hsl(227 92% 58%)"/>
      <stop offset="1" stop-color="hsl(257 76% 50%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.52" r="0.85">
      <stop offset="0" stop-color="hsl(227 100% 74%)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="hsl(227 100% 74%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#020526" stop-opacity="0"/>
      <stop offset="1" stop-color="#020526" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff">
    <polygon points="177.8,59.5 177.8,120.5 125.0,151.0 72.2,120.5 72.2,59.5 125.0,29.0" stroke-opacity="0.079" stroke-width="3.3"/>
    <polygon points="176.5,277.0 176.5,393.0 76.0,451.0 -24.5,393.0 -24.5,277.0 76.0,219.0" stroke-opacity="0.115" stroke-width="2.0"/>
    <polygon points="119.1,-32.0 119.1,94.0 10.0,157.0 -99.1,94.0 -99.1,-32.0 10.0,-95.0" stroke-opacity="0.063" stroke-width="3.5"/>
    <polygon points="554.0,93.0 554.0,153.0 502.0,183.0 450.0,153.0 450.0,93.0 502.0,63.0" stroke-opacity="0.091" stroke-width="3.4"/>
    <polygon points="603.3,311.0 603.3,413.0 515.0,464.0 426.7,413.0 426.7,311.0 515.0,260.0" stroke-opacity="0.141" stroke-width="3.2"/>
    <polygon points="625.1,113.5 625.1,172.5 574.0,202.0 522.9,172.5 522.9,113.5 574.0,84.0" stroke-opacity="0.146" stroke-width="2.1"/>
    <polygon points="167.1,221.0 167.1,347.0 58.0,410.0 -51.1,347.0 -51.1,221.0 58.0,158.0" stroke-opacity="0.109" stroke-width="2.6"/>
    <polygon points="171.7,-32.5 171.7,44.5 105.0,83.0 38.3,44.5 38.3,-32.5 105.0,-71.0" stroke-opacity="0.116" stroke-width="2.6"/>
    <polygon points="188.1,131.5 188.1,242.5 92.0,298.0 -4.1,242.5 -4.1,131.5 92.0,76.0" stroke-opacity="0.081" stroke-width="1.5"/>
  </g>
  <!-- Darkened towards the bottom, because the card prints the event's name
       and date directly beneath and the two should not compete. -->
  <rect width="800" height="450" fill="url(#shade)"/>
  <text x="40" y="412" fill="#ffffff" fill-opacity="0.92"
        font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="6">MUMBAI</text>
</svg>
