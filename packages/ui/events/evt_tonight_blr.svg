<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="ReXell Live — Gate Demo Night">
  <title>ReXell Live — Gate Demo Night — Sree Kanteerava Stadium, Bengaluru</title>
  <defs>
    <linearGradient id="g" x1="0" y1="450" x2="800" y2="0" gradientUnits="userSpaceOnUse"
                    gradientTransform="rotate(15 400 225)">
      <stop offset="0" stop-color="hsl(296 92% 58%)"/>
      <stop offset="1" stop-color="hsl(300 76% 50%)"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.17" r="0.85">
      <stop offset="0" stop-color="hsl(296 100% 74%)" stop-opacity="0.55"/>
      <stop offset="1" stop-color="hsl(296 100% 74%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#020526" stop-opacity="0"/>
      <stop offset="1" stop-color="#020526" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff">
    <polygon points="394.7,135.0 394.7,197.0 341.0,228.0 287.3,197.0 287.3,135.0 341.0,104.0" stroke-opacity="0.105" stroke-width="2.6"/>
    <polygon points="596.5,79.5 596.5,172.5 516.0,219.0 435.5,172.5 435.5,79.5 516.0,33.0" stroke-opacity="0.111" stroke-width="2.8"/>
    <polygon points="376.5,290.5 376.5,413.5 270.0,475.0 163.5,413.5 163.5,290.5 270.0,229.0" stroke-opacity="0.121" stroke-width="2.7"/>
    <polygon points="162.9,72.5 162.9,177.5 72.0,230.0 -18.9,177.5 -18.9,72.5 72.0,20.0" stroke-opacity="0.095" stroke-width="2.1"/>
    <polygon points="289.4,197.0 289.4,321.0 182.0,383.0 74.6,321.0 74.6,197.0 182.0,135.0" stroke-opacity="0.119" stroke-width="2.0"/>
    <polygon points="291.4,287.5 291.4,418.5 178.0,484.0 64.6,418.5 64.6,287.5 178.0,222.0" stroke-opacity="0.085" stroke-width="2.3"/>
    <polygon points="541.8,340.5 541.8,431.5 463.0,477.0 384.2,431.5 384.2,340.5 463.0,295.0" stroke-opacity="0.079" stroke-width="2.4"/>
    <polygon points="185.7,15.5 185.7,62.5 145.0,86.0 104.3,62.5 104.3,15.5 145.0,-8.0" stroke-opacity="0.111" stroke-width="2.7"/>
    <polygon points="487.8,145.0 487.8,281.0 370.0,349.0 252.2,281.0 252.2,145.0 370.0,77.0" stroke-opacity="0.112" stroke-width="2.5"/>
  </g>
  <!-- Darkened towards the bottom, because the card prints the event's name
       and date directly beneath and the two should not compete. -->
  <rect width="800" height="450" fill="url(#shade)"/>
  <text x="40" y="412" fill="#ffffff" fill-opacity="0.92"
        font-family="Archivo, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="800" letter-spacing="6">BENGALURU</text>
