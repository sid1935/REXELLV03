<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ReXell">
  <title>ReXell</title>
  <!--
    ReXell Technologies mark — hexagonal shield with an R, in the cyan →
    royal blue → violet gradient from the official logo.
  -->
  <defs>
    <linearGradient id="rexell-edge" x1="6" y1="58" x2="58" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D2FF"/>
      <stop offset="0.48" stop-color="#2472FF"/>
      <stop offset="1" stop-color="#9D50BB"/>
    </linearGradient>
    <linearGradient id="rexell-letter" x1="20" y1="46" x2="46" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D2FF"/>
      <stop offset="0.5" stop-color="#3A7FFF"/>
      <stop offset="1" stop-color="#B060D0"/>
    </linearGradient>
  </defs>

  <path d="M32 3.4 56.5 17.7 56.5 46.3 32 60.6 7.5 46.3 7.5 17.7Z"
        fill="none" stroke="url(#rexell-edge)" stroke-width="3.2"
        stroke-linejoin="round"/>

  <g fill="none" stroke="url(#rexell-letter)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 45.5V19h9.4a7.3 7.3 0 0 1 0 14.6H24"/>
    <path d="M33.2 33.8 41.6 45.5"/>
  </g>
</svg>
