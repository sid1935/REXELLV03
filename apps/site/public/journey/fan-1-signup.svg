<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Sign up and verification</title>
  <desc id="d">A face inside a capture viewfinder, with the wallet that is created alongside it.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="52" y="54" width="252" height="252" rx="26"/></clipPath>
  </defs>

  <rect width="640" height="360" fill="#070a1e"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the viewfinder -->
  <rect x="52" y="54" width="252" height="252" rx="26" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
  <g clip-path="url(#frame)">
    <!-- head and shoulders, drawn as the mesh the template is built from -->
    <g fill="none" stroke="url(#g)" stroke-width="2" stroke-opacity="0.9">
      <circle cx="178" cy="158" r="54"/>
      <path d="M104 292c0-40 33-62 74-62s74 22 74 62"/>
    </g>
    <g fill="none" stroke="#7dd3fc" stroke-opacity="0.45" stroke-width="1">
      <path d="M178 104v108M124 158h108M140 120l76 76M216 120l-76 76"/>
      <ellipse cx="178" cy="158" rx="54" ry="28"/>
      <ellipse cx="178" cy="158" rx="28" ry="54"/>
    </g>
    <g fill="#e0f2fe">
      <circle cx="178" cy="104" r="3"/><circle cx="124" cy="158" r="3"/><circle cx="232" cy="158" r="3"/>
      <circle cx="178" cy="212" r="3"/><circle cx="140" cy="120" r="3"/><circle cx="216" cy="120" r="3"/>
      <circle cx="140" cy="196" r="3"/><circle cx="216" cy="196" r="3"/><circle cx="178" cy="158" r="3"/>
      <circle cx="104" cy="292" r="3"/><circle cx="252" cy="292" r="3"/>
    </g>
    <!-- the scan pass -->
    <rect x="52" y="196" width="252" height="2" fill="#67e8f9" opacity="0.85"/>
    <rect x="52" y="198" width="252" height="42" fill="#67e8f9" opacity="0.1"/>
  </g>
  <!-- corner brackets -->
  <g fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round">
    <path d="M62 100V78a16 16 0 0 1 16-16h22"/>
    <path d="M256 62h22a16 16 0 0 1 16 16v22"/>
    <path d="M294 260v22a16 16 0 0 1-16 16h-22"/>
    <path d="M100 298H78a16 16 0 0 1-16-16v-22"/>
  </g>

  <!-- what the capture produces -->
  <g transform="translate(348 92)">
    <rect width="236" height="84" rx="16" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="18" y="22" width="40" height="40" rx="10" fill="url(#g)" opacity="0.9"/>
    <path d="M28 42l8 8 14-16" fill="none" stroke="#071229" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="26" width="120" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="72" y="46" width="76" height="8" rx="4" fill="#ffffff" opacity="0.22"/>
  </g>

  <g transform="translate(348 196)">
    <rect width="236" height="110" rx="16" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="18" y="20" width="200" height="34" rx="9" fill="url(#g)" opacity="0.22"/>
    <rect x="30" y="31" width="118" height="12" rx="6" fill="#7dd3fc" opacity="0.75"/>
    <g transform="translate(18 68)">
      <circle cx="16" cy="16" r="16" fill="url(#g)"/>
      <circle cx="44" cy="16" r="16" fill="url(#g)" opacity="0.6"/>
      <circle cx="72" cy="16" r="16" fill="url(#g)" opacity="0.3"/>
      <rect x="102" y="10" width="98" height="12" rx="6" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>
</svg>
