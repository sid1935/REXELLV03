<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Monitor and control</title>
  <desc id="d">A live sales dashboard: a rising curve, inventory by tier, and the bot attempts being turned away.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c026d3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0a0720"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- headline figures -->
  <g transform="translate(44 44)">
    <g>
      <rect width="168" height="74" rx="16" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="20" y="20" width="52" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
      <rect x="20" y="38" width="96" height="16" rx="6" fill="url(#g)"/>
    </g>
    <g transform="translate(190 0)">
      <rect width="168" height="74" rx="16" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="20" y="20" width="44" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
      <rect x="20" y="38" width="72" height="16" rx="6" fill="url(#g)" opacity="0.7"/>
    </g>
    <g transform="translate(380 0)">
      <rect width="168" height="74" rx="16" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="20" y="20" width="60" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
      <rect x="20" y="38" width="58" height="16" rx="6" fill="url(#g)" opacity="0.45"/>
    </g>
  </g>

  <!-- sales, live -->
  <g transform="translate(44 138)">
    <rect width="358" height="178" rx="20" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(24 26)">
      <rect width="84" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
      <circle cx="304" cy="4" r="5" fill="#f0abfc"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.07">
      <path d="M24 92h310M24 124h310M24 60h310"/>
    </g>
    <path d="M24 138 L70 128 L116 118 L162 122 L208 96 L254 78 L300 52 L334 34"
          fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 138 L70 128 L116 118 L162 122 L208 96 L254 78 L300 52 L334 34 L334 152 L24 152 Z" fill="url(#fill)"/>
    <circle cx="334" cy="34" r="6" fill="#fdf4ff"/>
    <circle cx="334" cy="34" r="12" fill="#f0abfc" opacity="0.22"/>
  </g>

  <!-- inventory and the bots that do not get any -->
  <g transform="translate(424 138)">
    <rect width="172" height="178" rx="20" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(22 26)">
      <rect width="66" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    </g>
    <g transform="translate(22 52)">
      <g>
        <rect width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
        <rect width="118" height="10" rx="5" fill="url(#g)"/>
      </g>
      <g transform="translate(0 26)">
        <rect width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
        <rect width="84" height="10" rx="5" fill="url(#g)" opacity="0.75"/>
      </g>
      <g transform="translate(0 52)">
        <rect width="128" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
        <rect width="46" height="10" rx="5" fill="url(#g)" opacity="0.5"/>
      </g>
    </g>
    <g transform="translate(22 138)">
      <rect width="128" height="30" rx="9" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.4"/>
      <g transform="translate(12 9)">
        <rect width="16" height="12" rx="4" fill="none" stroke="#f87171" stroke-width="2"/>
        <path d="M8 0v-4" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="38" y="11" width="46" height="8" rx="4" fill="#f87171" opacity="0.45"/>
      <g transform="translate(96 9)" stroke="#f87171" stroke-width="2.6" stroke-linecap="round">
        <path d="M0 0l12 12M12 0L0 12"/>
      </g>
    </g>
  </g>
</svg>
