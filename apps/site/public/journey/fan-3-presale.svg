<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Priority pre-sales</title>
  <desc id="d">A ticket at a locked face price, with real fans admitted ahead of the bots that are turned away.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.35" r="0.62">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <mask id="stub">
      <rect width="640" height="360" fill="#000"/>
      <rect x="44" y="66" width="300" height="150" rx="18" fill="#fff"/>
      <circle cx="252" cy="66" r="14" fill="#000"/>
      <circle cx="252" cy="216" r="14" fill="#000"/>
    </mask>
  </defs>

  <rect width="640" height="360" fill="#05130f"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the ticket, at the price it was printed at -->
  <g mask="url(#stub)">
    <rect x="44" y="66" width="300" height="150" fill="#0a2119"/>
    <rect x="44" y="66" width="300" height="150" fill="url(#g)" opacity="0.14"/>
  </g>
  <g fill="none" stroke="url(#g)" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 7">
    <path d="M252 84v114"/>
  </g>
  <g transform="translate(70 96)">
    <rect width="120" height="11" rx="5.5" fill="#ffffff" opacity="0.6"/>
    <rect y="26" width="84" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
    <!-- the price, and the lock that holds it there -->
    <g transform="translate(0 56)">
      <rect width="104" height="34" rx="10" fill="url(#g)" opacity="0.9"/>
      <g transform="translate(14 8)" fill="none" stroke="#052e20" stroke-width="2.6" stroke-linecap="round">
        <path d="M3 8V6a5 5 0 0 1 10 0v2"/>
        <rect x="1" y="8" width="14" height="10" rx="3" fill="#052e20" stroke="none"/>
      </g>
      <rect x="42" y="14" width="48" height="7" rx="3.5" fill="#052e20" opacity="0.8"/>
    </g>
  </g>
  <g transform="translate(276 122)">
    <circle cx="24" cy="24" r="24" fill="url(#g)" opacity="0.2"/>
    <path d="M13 24l7 7 15-16" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the queue: top fans first, and what does not get in -->
  <g transform="translate(44 250)">
    <rect width="300" height="66" rx="18" fill="#0a2119" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(24 33)">
      <g fill="url(#g)">
        <circle cx="0" cy="0" r="15"/>
        <circle cx="34" cy="0" r="15" opacity="0.8"/>
        <circle cx="68" cy="0" r="15" opacity="0.6"/>
        <circle cx="102" cy="0" r="15" opacity="0.42"/>
        <circle cx="136" cy="0" r="15" opacity="0.26"/>
      </g>
      <path d="M166 0h44" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="M204 -6l8 6-8 6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="228" y="-13" width="26" height="26" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    </g>
  </g>

  <!-- the gate, and the bot it refuses -->
  <g transform="translate(380 66)">
    <rect width="216" height="250" rx="20" fill="#0a2119" stroke="#ffffff" stroke-opacity="0.1"/>

    <g transform="translate(24 30)">
      <rect width="72" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- admitted -->
    <g transform="translate(20 60)">
      <rect width="176" height="52" rx="12" fill="url(#g)" fill-opacity="0.16" stroke="url(#g)" stroke-opacity="0.6"/>
      <circle cx="30" cy="26" r="14" fill="url(#g)"/>
      <path d="M23 26l5 5 11-11" fill="none" stroke="#052e20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="16" width="96" height="8" rx="4" fill="#bbf7d0" opacity="0.85"/>
      <rect x="56" y="30" width="62" height="8" rx="4" fill="#bbf7d0" opacity="0.4"/>
    </g>

    <g transform="translate(20 124)">
      <rect width="176" height="52" rx="12" fill="url(#g)" fill-opacity="0.1" stroke="url(#g)" stroke-opacity="0.35"/>
      <circle cx="30" cy="26" r="14" fill="url(#g)" opacity="0.7"/>
      <path d="M23 26l5 5 11-11" fill="none" stroke="#052e20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="16" width="80" height="8" rx="4" fill="#bbf7d0" opacity="0.6"/>
      <rect x="56" y="30" width="54" height="8" rx="4" fill="#bbf7d0" opacity="0.3"/>
    </g>

    <!-- refused: a bot, and a script that will not run twice -->
    <g transform="translate(20 188)">
      <rect width="176" height="52" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ef4444" stroke-opacity="0.5" stroke-dasharray="6 5"/>
      <g transform="translate(16 12)">
        <rect width="28" height="22" rx="7" fill="none" stroke="#f87171" stroke-width="2.2"/>
        <circle cx="9.5" cy="11" r="2.6" fill="#f87171"/><circle cx="18.5" cy="11" r="2.6" fill="#f87171"/>
        <path d="M14 0v-5" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <rect x="56" y="16" width="70" height="8" rx="4" fill="#f87171" opacity="0.3"/>
      <rect x="56" y="30" width="44" height="8" rx="4" fill="#f87171" opacity="0.18"/>
      <g transform="translate(146 16)" stroke="#f87171" stroke-width="3" stroke-linecap="round">
        <path d="M0 0l18 18M18 0L0 18"/>
      </g>
    </g>
  </g>
</svg>
