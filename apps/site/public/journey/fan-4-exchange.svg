<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Peer-to-peer exchange</title>
  <desc id="d">A ticket passing between two wallets through a contract that caps the price and splits the royalty.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#17070a"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- seller -->
  <g transform="translate(40 96)">
    <rect width="150" height="120" rx="18" fill="#25101a" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="34" cy="38" r="16" fill="url(#g)" opacity="0.85"/>
    <rect x="60" y="26" width="62" height="9" rx="4.5" fill="#ffffff" opacity="0.45"/>
    <rect x="60" y="42" width="40" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="70" width="110" height="32" rx="10" fill="url(#g)" fill-opacity="0.18" stroke="url(#g)" stroke-opacity="0.5"/>
    <rect x="32" y="82" width="58" height="8" rx="4" fill="#fdba74" opacity="0.8"/>
  </g>

  <!-- buyer -->
  <g transform="translate(450 96)">
    <rect width="150" height="120" rx="18" fill="#25101a" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="34" cy="38" r="16" fill="url(#g)" opacity="0.6"/>
    <rect x="60" y="26" width="62" height="9" rx="4.5" fill="#ffffff" opacity="0.45"/>
    <rect x="60" y="42" width="40" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="20" y="70" width="110" height="32" rx="10" fill="url(#g)" fill-opacity="0.18" stroke="url(#g)" stroke-opacity="0.5"/>
    <rect x="32" y="82" width="58" height="8" rx="4" fill="#fdba74" opacity="0.8"/>
  </g>

  <!-- the contract the trade has to pass through -->
  <g transform="translate(238 78)">
    <rect width="164" height="156" rx="22" fill="#2a0f14" stroke="url(#g)" stroke-opacity="0.55"/>
    <g transform="translate(58 22)">
      <rect width="48" height="48" rx="14" fill="url(#g)"/>
      <g fill="none" stroke="#2a0f14" stroke-width="3.4" stroke-linecap="round">
        <path d="M16 18v-3a8 8 0 0 1 16 0v3"/>
      </g>
      <rect x="14" y="20" width="20" height="16" rx="4" fill="#2a0f14"/>
    </g>
    <rect x="32" y="86" width="100" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
    <!-- the cap: what is allowed, and the part that is not -->
    <g transform="translate(32 110)">
      <rect width="100" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
      <rect width="66" height="10" rx="5" fill="url(#g)"/>
      <path d="M66 -6v22" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <rect x="32" y="132" width="58" height="7" rx="3.5" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- the ticket crossing, and the royalty going back -->
  <g fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round">
    <path d="M196 140h32" stroke-dasharray="7 7"/>
    <path d="M412 140h32" stroke-dasharray="7 7"/>
  </g>
  <path d="M222 134l8 6-8 6" fill="none" stroke="#fdba74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M438 134l8 6-8 6" fill="none" stroke="#fdba74" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(40 262)">
    <rect width="560" height="62" rx="18" fill="#25101a" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(26 31)">
      <circle cx="0" cy="0" r="11" fill="url(#g)"/>
      <path d="M-5 0l3.6 3.6L6 -4" fill="none" stroke="#2a0f14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="-5" width="128" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    </g>
    <g transform="translate(232 31)">
      <circle cx="0" cy="0" r="11" fill="url(#g)" opacity="0.75"/>
      <path d="M-5 0l3.6 3.6L6 -4" fill="none" stroke="#2a0f14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="-5" width="104" height="10" rx="5" fill="#ffffff" opacity="0.28"/>
    </g>
    <g transform="translate(414 31)">
      <circle cx="0" cy="0" r="11" fill="url(#g)" opacity="0.5"/>
      <path d="M-5 0l3.6 3.6L6 -4" fill="none" stroke="#2a0f14" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="-5" width="88" height="10" rx="5" fill="#ffffff" opacity="0.22"/>
    </g>
  </g>
</svg>
