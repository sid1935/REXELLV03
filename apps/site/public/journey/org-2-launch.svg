<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Launch your event</title>
  <desc id="d">A venue laid out into priced tiers, with the resale rules set alongside it.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#070a1e"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the plan of the room -->
  <g transform="translate(44 46)">
    <rect width="318" height="268" rx="20" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="20" y="240" width="278" height="80" fill="url(#stage)" transform="translate(0 -214) scale(1 -1)" opacity="0"/>

    <!-- stage -->
    <g transform="translate(79 26)">
      <rect width="160" height="20" rx="8" fill="url(#g)"/>
      <rect x="-20" y="24" width="200" height="46" fill="url(#stage)"/>
    </g>

    <!-- tiers, nearest the stage costs most -->
    <g transform="translate(34 96)">
      <rect width="250" height="42" rx="10" fill="url(#g)" fill-opacity="0.55" stroke="url(#g)" stroke-opacity="0.8"/>
      <rect x="16" y="16" width="62" height="9" rx="4.5" fill="#082f49" opacity="0.9"/>
      <rect x="188" y="16" width="46" height="9" rx="4.5" fill="#082f49" opacity="0.9"/>
    </g>
    <g transform="translate(34 148)">
      <rect width="250" height="42" rx="10" fill="url(#g)" fill-opacity="0.3" stroke="url(#g)" stroke-opacity="0.5"/>
      <rect x="16" y="16" width="54" height="9" rx="4.5" fill="#bae6fd" opacity="0.7"/>
      <rect x="188" y="16" width="46" height="9" rx="4.5" fill="#bae6fd" opacity="0.7"/>
    </g>
    <g transform="translate(34 200)">
      <rect width="250" height="42" rx="10" fill="url(#g)" fill-opacity="0.14" stroke="url(#g)" stroke-opacity="0.3"/>
      <rect x="16" y="16" width="70" height="9" rx="4.5" fill="#bae6fd" opacity="0.45"/>
      <rect x="188" y="16" width="46" height="9" rx="4.5" fill="#bae6fd" opacity="0.45"/>
    </g>
  </g>

  <!-- the terms set at the same time -->
  <g transform="translate(380 46)">
    <rect width="216" height="126" rx="20" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(24 26)">
      <rect width="76" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    </g>
    <!-- price cap slider -->
    <g transform="translate(24 58)">
      <rect width="168" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
      <rect width="112" height="8" rx="4" fill="url(#g)"/>
      <circle cx="112" cy="4" r="9" fill="#e0f2fe"/>
    </g>
    <!-- royalty slider -->
    <g transform="translate(24 90)">
      <rect width="168" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
      <rect width="58" height="8" rx="4" fill="url(#g)"/>
      <circle cx="58" cy="4" r="9" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- media upload -->
  <g transform="translate(380 188)">
    <rect width="216" height="126" rx="20" fill="#0b1030" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(24 24)">
      <rect width="168" height="78" rx="12" fill="url(#g)" fill-opacity="0.12" stroke="url(#g)" stroke-opacity="0.4" stroke-dasharray="7 6"/>
      <g transform="translate(84 39)" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M0 -14v28M-14 0h28"/>
      </g>
    </g>
  </g>
</svg>
