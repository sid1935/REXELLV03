<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Account and verification</title>
  <desc id="d">Business documents checked off, and the signing key that the verified account is issued.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#05130f"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the filing, stamped -->
  <g transform="translate(52 44)">
    <rect x="16" y="12" width="220" height="272" rx="18" fill="#0a2119" opacity="0.55"/>
    <rect x="8" y="6" width="220" height="272" rx="18" fill="#0a2119" opacity="0.75"/>
    <rect width="220" height="272" rx="18" fill="#0b2b21" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(26 30)">
      <rect width="112" height="12" rx="6" fill="#ffffff" opacity="0.5"/>
      <rect y="26" width="64" height="9" rx="4.5" fill="#ffffff" opacity="0.22"/>
    </g>
    <g transform="translate(26 96)">
      <g>
        <rect width="168" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
        <rect y="18" width="140" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
        <rect y="36" width="156" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
        <rect y="54" width="102" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
      </g>
    </g>
    <!-- the stamp -->
    <g transform="translate(120 188)">
      <circle cx="42" cy="42" r="42" fill="url(#g)" fill-opacity="0.16" stroke="url(#g)" stroke-opacity="0.75" stroke-width="2.5"/>
      <circle cx="42" cy="42" r="32" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-dasharray="4 6"/>
      <path d="M28 43l10 10 20-22" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- what the check produces -->
  <g transform="translate(320 62)">
    <rect width="276" height="108" rx="18" fill="#0b2b21" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(24 26)">
      <rect width="48" height="56" rx="12" fill="url(#g)" opacity="0.2"/>
      <circle cx="24" cy="22" r="10" fill="url(#g)"/>
      <path d="M8 46c0-9 7-14 16-14s16 5 16 14z" fill="url(#g)" opacity="0.8"/>
      <rect x="68" y="6" width="132" height="10" rx="5" fill="#ffffff" opacity="0.5"/>
      <rect x="68" y="26" width="92" height="9" rx="4.5" fill="#ffffff" opacity="0.22"/>
      <g transform="translate(68 46)">
        <rect width="86" height="22" rx="7" fill="url(#g)" fill-opacity="0.2" stroke="url(#g)" stroke-opacity="0.5"/>
        <rect x="10" y="7" width="52" height="8" rx="4" fill="#bbf7d0" opacity="0.8"/>
      </g>
    </g>
  </g>

  <!-- the signing key that goes with it -->
  <g transform="translate(320 190)">
    <rect width="276" height="108" rx="18" fill="#0b2b21" stroke="#ffffff" stroke-opacity="0.12"/>
    <g transform="translate(26 30)">
      <circle cx="20" cy="20" r="20" fill="url(#g)"/>
      <g fill="#052e20">
        <circle cx="15" cy="15" r="6"/>
        <path d="M19 19l12 12v6h-6l-1-5h-5l-2-5z"/>
      </g>
      <rect x="60" y="4" width="150" height="10" rx="5" fill="#ffffff" opacity="0.4"/>
      <g transform="translate(60 26)" fill="url(#g)">
        <rect width="14" height="10" rx="3"/>
        <rect x="20" width="26" height="10" rx="3" opacity="0.8"/>
        <rect x="52" width="18" height="10" rx="3" opacity="0.6"/>
        <rect x="76" width="34" height="10" rx="3" opacity="0.45"/>
        <rect x="116" width="22" height="10" rx="3" opacity="0.3"/>
      </g>
    </g>
    <g transform="translate(26 82)">
      <rect width="224" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
    </g>
  </g>
</svg>
