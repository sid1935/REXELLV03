<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 40 616 286" width="616" height="286" role="img" aria-labelledby="t d">
  <title id="t">Earn fan score</title>
  <desc id="d">A leaderboard with a climbing score, and the tasks that raise it.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.66" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="#0a0720"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640"/>
    <path d="M80 0v360M160 0v360M240 0v360M320 0v360M400 0v360M480 0v360M560 0v360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- the leaderboard: the rank that is being climbed -->
  <g transform="translate(44 56)">
    <rect width="250" height="248" rx="20" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(20 24)">
      <rect width="70" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
    </g>
    <!-- rows, the third one is yours and it is lit -->
    <g transform="translate(16 56)">
      <g opacity="0.45">
        <rect width="218" height="38" rx="10" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="26" cy="19" r="12" fill="#ffffff" fill-opacity="0.16"/>
        <rect x="50" y="14" width="96" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="172" y="14" width="30" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.2"/>
      </g>
      <g transform="translate(0 46)" opacity="0.45">
        <rect width="218" height="38" rx="10" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="26" cy="19" r="12" fill="#ffffff" fill-opacity="0.16"/>
        <rect x="50" y="14" width="80" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="172" y="14" width="30" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.2"/>
      </g>
      <g transform="translate(0 92)">
        <rect width="218" height="38" rx="10" fill="url(#g)" fill-opacity="0.22" stroke="url(#g)" stroke-opacity="0.7"/>
        <circle cx="26" cy="19" r="12" fill="url(#g)"/>
        <rect x="50" y="14" width="90" height="9" rx="4.5" fill="#f5d0fe" fill-opacity="0.9"/>
        <rect x="172" y="14" width="30" height="9" rx="4.5" fill="#f5d0fe" fill-opacity="0.7"/>
        <!-- moving up -->
        <path d="M198 24l8-10 8 10z" fill="#f0abfc"/>
      </g>
      <g transform="translate(0 138)" opacity="0.45">
        <rect width="218" height="38" rx="10" fill="#ffffff" fill-opacity="0.05"/>
        <circle cx="26" cy="19" r="12" fill="#ffffff" fill-opacity="0.16"/>
        <rect x="50" y="14" width="104" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="172" y="14" width="30" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.2"/>
      </g>
    </g>
  </g>

  <!-- the score itself, rising -->
  <g transform="translate(330 56)">
    <rect width="266" height="136" rx="20" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(22 24)">
      <rect width="64" height="9" rx="4.5" fill="#ffffff" opacity="0.3"/>
    </g>
    <!-- the climb -->
    <g transform="translate(22 52)">
      <g fill="url(#g)">
        <rect x="0" y="46" width="18" height="16" rx="5" opacity="0.35"/>
        <rect x="28" y="36" width="18" height="26" rx="5" opacity="0.45"/>
        <rect x="56" y="40" width="18" height="22" rx="5" opacity="0.4"/>
        <rect x="84" y="24" width="18" height="38" rx="5" opacity="0.6"/>
        <rect x="112" y="16" width="18" height="46" rx="5" opacity="0.75"/>
        <rect x="140" y="4" width="18" height="58" rx="5"/>
      </g>
      <path d="M9 52 37 42 65 46 93 30 121 22 149 8" fill="none" stroke="#f0abfc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="149" cy="8" r="5" fill="#fdf4ff"/>
      <!-- the badge the climb unlocks -->
      <g transform="translate(182 4)">
        <circle cx="20" cy="26" r="24" fill="url(#g)"/>
        <path d="M20 12l4.6 9.3 10.4 1.5-7.5 7.3 1.8 10.3L20 35.6l-9.3 4.8 1.8-10.3-7.5-7.3 10.4-1.5z" fill="#1a0b2e" opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- the tasks that earn it -->
  <g transform="translate(330 212)">
    <rect width="266" height="92" rx="20" fill="#120a2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(22 22)">
      <g>
        <circle cx="10" cy="10" r="10" fill="url(#g)"/>
        <path d="M5 10l3.5 3.5L16 6" fill="none" stroke="#1a0b2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="30" y="5" width="150" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
      </g>
      <g transform="translate(0 28)">
        <circle cx="10" cy="10" r="10" fill="url(#g)"/>
        <path d="M5 10l3.5 3.5L16 6" fill="none" stroke="#1a0b2e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="30" y="5" width="118" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
      </g>
      <g transform="translate(0 56)" opacity="0.5">
        <circle cx="10" cy="10" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <rect x="30" y="5" width="94" height="9" rx="4.5" fill="#ffffff" opacity="0.28"/>
      </g>
    </g>
  </g>
</svg>
