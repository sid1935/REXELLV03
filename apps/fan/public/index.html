<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#020526">
<title>ReXell</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="/logo-full.png" type="image/png">
<link rel="stylesheet" href="/ui.css">
<style>
  .fan-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
  .fan-head h1 { font-size: 22px; }
  .event-card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-lg);
    padding: 0; overflow: hidden; box-shadow: var(--lift);
    transition: transform var(--fast), box-shadow var(--fast);
  }
  .event-card:hover { transform: translateY(-1px); box-shadow: var(--lift-2); }
  .event-card .body { padding: 15px 16px; }
  .event-card h3 { font-size: 15.5px; margin-bottom: 3px; }
  .event-strip { height: 5px; background: var(--brand-gradient); }
  .price { font: 700 16px/1 var(--sans); font-variant-numeric: tabular-nums; }
  .sheet {
    position: fixed; inset: 0; z-index: 60; display: grid; align-items: end;
    background: rgba(8, 14, 13, 0.5); backdrop-filter: blur(3px);
    animation: fade var(--fast);
  }
  .sheet-panel {
    background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 20px 18px calc(22px + env(safe-area-inset-bottom));
    max-width: 460px; margin: 0 auto; width: 100%;
    max-height: 88dvh; overflow-y: auto;
    animation: slideUp var(--slow);
  }
  @keyframes fade { from { opacity: 0 } }
  @keyframes slideUp { from { transform: translateY(14px) } }
  .grabber { width: 36px; height: 4px; border-radius: var(--r-full); background: var(--rule); margin: 0 auto 16px; }
  .consent-item {
    display: flex; gap: 12px; padding: 14px; border: 1px solid var(--rule);
    border-radius: var(--r); background: var(--surface-2);
  }
  .consent-item svg { flex: none; color: var(--brand); margin-top: 1px; }
</style>
</head>
<body>

<div class="phone">
  <header class="fan-head">
    <span class="brand-lockup brand-lockup--dark"><span class="brand-mark"><img src="/logo-full.png" alt="ReXell"></span></span>
    <span class="brand brand-lockup brand-lockup--light"><span class="brand-mark"></span><span class="brand-word">ReXell</span></span>
    <h1 id="pageTitle">Your tickets</h1>
    <span class="spacer"></span>
    <span class="tag" id="idTag" hidden></span>
  </header>

  <div class="phone-body">
    <section id="view-tickets"></section>
    <section id="view-discover" hidden></section>
    <section id="view-sell" hidden></section>
    <section id="view-you" hidden></section>
  </div>

  <nav class="tabbar" id="tabs">
    <button data-view="tickets" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M13 5v14" stroke-dasharray="2 3"/></svg>
      Tickets
    </button>
    <button data-view="discover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Discover
    </button>
    <button data-view="sell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M17 7H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H6"/></svg>
      Resell
    </button>
    <button data-view="you">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      You
    </button>
  </nav>
</div>

<div class="toasts" id="toasts"></div>
<div id="sheetHost"></div>

<!-- Serves the API origin chosen by the process, so it is not guessable from a URL. -->
<script src="/config.js"></script>
<script type="module" src="/fan.js"></script>
</body>
</html>
